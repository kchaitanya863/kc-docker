version: '3.8'

services:
  cache:
    image: redis:alpine
    command: ["redis-server", "--protected-mode", "no", "--dir", "/tmp"]
    volumes:
      - cache-volume:/data
    ports:
      - "6399:6379"

  backend:
    build: ./backend
    ports:
      - "5055:5000"
    volumes:
      - app-data:/data
    environment:
      - APP_ENV=production
      - CACHE_HOST=cache
      - CACHE_PORT=6379
    depends_on:
      - cache

  frontend:
    build: ./frontend
    ports:
      - "8099:8080"
    environment:
      - API_URL=http://localhost:5055
    depends_on:
      - backend

volumes:
  cache-volume:
  app-data:
