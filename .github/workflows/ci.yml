name: CI & Automated Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -A clippy::all

      - name: Build boxr binary
        run: cargo build

      - name: Run Test Suite
        run: cargo test --all --verbose -- --test-threads=1

  bump-and-tag:
    name: Bump Version & Create Git Tag
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.tag }}
      new_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Next Version
        id: version
        run: |
          CURRENT_VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "Current Cargo version: $CURRENT_VER"

          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VER="$CURRENT_VER"
          else
            BASE_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$BASE_VER" | cut -d. -f1)
            MINOR=$(echo "$BASE_VER" | cut -d. -f2)
            PATCH=$(echo "$BASE_VER" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          NEW_TAG="v${NEW_VER}"
          echo "Next Release Tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

          sed -i 's/^version = ".*"/version = "'"$NEW_VER"'"/' Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to $NEW_TAG [skip ci]" || true
          git push origin main
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

  release:
    name: Build & Publish Release (${{ matrix.target }})
    needs: [test, bump-and-tag]
    if: always() && needs.test.result == 'success' && (needs.bump-and-tag.result == 'success' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: boxr-linux-x86_64.tar.gz
            use_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: boxr-linux-arm64.tar.gz
            use_musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: boxr-macos-arm64.tar.gz
            use_musl: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: boxr-macos-x86_64.tar.gz
            use_musl: false
    steps:
      - name: Determine Target Tag
        id: tag_info
        run: |
          if [ -n "${{ needs.bump-and-tag.outputs.new_tag }}" ]; then
            TAG="${{ needs.bump-and-tag.outputs.new_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag_info.outputs.release_tag }}

      - name: Install musl-tools (Linux)
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Artifact
        run: |
          mkdir -p package/bin package/completions
          cp target/${{ matrix.target }}/release/boxr package/bin/
          cp install.sh package/
          cp README.md package/
          cp LICENSE package/ 2>/dev/null || true

          package/bin/boxr completion bash > package/completions/boxr.bash 2>/dev/null || true
          package/bin/boxr completion zsh > package/completions/_boxr 2>/dev/null || true
          package/bin/boxr completion fish > package/completions/boxr.fish 2>/dev/null || true

          tar -czvf ${{ matrix.artifact_name }} -C package .

      - name: Generate SHA-256 Checksum
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: Release ${{ steps.tag_info.outputs.release_tag }}
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  update-brew-tap:
    name: Publish Release & Update Homebrew Tap
    needs: [bump-and-tag, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew Tap repository
        uses: actions/checkout@v4
        with:
          repository: kchaitanya863/homebrew-boxr
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          path: homebrew-boxr

      - name: Download Release Assets
        id: dl
        run: |
          if [ -n "${{ needs.bump-and-tag.outputs.new_tag }}" ]; then
            TAG="${{ needs.bump-and-tag.outputs.new_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p assets
          gh release download "$TAG" --repo ${{ github.repository }} --dir assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Assets to Homebrew Tap Release
        run: |
          TAG="${{ steps.dl.outputs.tag }}"
          cd assets
          gh release create "$TAG" --repo kchaitanya863/homebrew-boxr --title "Release $TAG" --notes "Release $TAG of Boxr container engine" boxr-*.tar.gz boxr-*.tar.gz.sha256 || \
          gh release upload "$TAG" --repo kchaitanya863/homebrew-boxr boxr-*.tar.gz boxr-*.tar.gz.sha256 --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Formula/boxr.rb
        run: |
          TAG="${{ steps.dl.outputs.tag }}"

          MACOS_ARM_SHA=$(awk '{print $1}' assets/boxr-macos-arm64.tar.gz.sha256)
          MACOS_X86_SHA=$(awk '{print $1}' assets/boxr-macos-x86_64.tar.gz.sha256)
          LINUX_ARM_SHA=$(awk '{print $1}' assets/boxr-linux-arm64.tar.gz.sha256)
          LINUX_X86_SHA=$(awk '{print $1}' assets/boxr-linux-x86_64.tar.gz.sha256)

          cat << 'EOF' > homebrew-boxr/Formula/boxr.rb
          class Boxr < Formula
            desc "Fast, lightweight OCI container engine and runtime written in Rust"
            homepage "https://github.com/kchaitanya863/homebrew-boxr"
            license "Apache-2.0"
            head "https://github.com/kchaitanya863/kc-docker.git", branch: "main"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/kchaitanya863/homebrew-boxr/releases/download/__TAG__/boxr-macos-arm64.tar.gz"
                sha256 "__MACOS_ARM_SHA__"
              else
                url "https://github.com/kchaitanya863/homebrew-boxr/releases/download/__TAG__/boxr-macos-x86_64.tar.gz"
                sha256 "__MACOS_X86_SHA__"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/kchaitanya863/homebrew-boxr/releases/download/__TAG__/boxr-linux-arm64.tar.gz"
                sha256 "__LINUX_ARM_SHA__"
              else
                url "https://github.com/kchaitanya863/homebrew-boxr/releases/download/__TAG__/boxr-linux-x86_64.tar.gz"
                sha256 "__LINUX_X86_SHA__"
              end
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "bin/boxr"
              end

              # Shell completions
              bash_completion.install "completions/boxr.bash" => "boxr" if File.exist?("completions/boxr.bash")
              zsh_completion.install "completions/_boxr" => "_boxr" if File.exist?("completions/_boxr")
              fish_completion.install "completions/boxr.fish" => "boxr.fish" if File.exist?("completions/boxr.fish")
            end

            service do
              run [opt_bin/"boxr", "daemon"]
              keep_alive true
              log_path var/"log/boxr.log"
              error_log_path var/"log/boxr.log"
              working_dir var
            end

            def caveats
              <<~EOS
                To enable the docker drop-in alias wrapper:
                  boxr alias --install
                or add to your shell profile:
                  export PATH="$HOME/.boxr/bin:$PATH"
              EOS
            end

            test do
              assert_match "boxr", shell_output("#{bin}/boxr --version")
              assert_match "Containers:", shell_output("#{bin}/boxr info")
            end
          end
          EOF

          sed -i "s/__TAG__/${TAG}/g" homebrew-boxr/Formula/boxr.rb
          sed -i "s/__MACOS_ARM_SHA__/${MACOS_ARM_SHA}/g" homebrew-boxr/Formula/boxr.rb
          sed -i "s/__MACOS_X86_SHA__/${MACOS_X86_SHA}/g" homebrew-boxr/Formula/boxr.rb
          sed -i "s/__LINUX_ARM_SHA__/${LINUX_ARM_SHA}/g" homebrew-boxr/Formula/boxr.rb
          sed -i "s/__LINUX_X86_SHA__/${LINUX_X86_SHA}/g" homebrew-boxr/Formula/boxr.rb

          cd homebrew-boxr
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump formula to ${TAG}" || true
          git push origin main || true
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

